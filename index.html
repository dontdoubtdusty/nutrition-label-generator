/* Shows a message in a status line, styled as an error when asked */
function setStatus(node, text, isError) {
  node.textContent = text;
  node.className = 'status' + (isError ? ' error' : '');
}

/* Redraws the label and its source note for the active mode */
function drawLabel() {
  let label = state.label;
  let note = state.sourceText;
  if (state.mode === 'recipe') {
    label = recipe.label || SAMPLE_LABEL;
    note = recipe.label ? recipe.sourceText : 'Sample data. Add ingredients and press Calculate.';
  } else if (state.mode === 'barcode') {
    label = barcode.label || SAMPLE_LABEL;
    note = barcode.label ? barcode.sourceText : 'Sample data. Scan or enter a barcode to replace it.';
  }
  ui.labelMount.replaceChildren(renderLabel(label));
  ui.sourceNote.textContent = note;
}

/* Switches between the single-food, recipe and barcode panels */
function setMode(mode) {
  state.mode = mode;
  if (mode !== 'barcode') stopScan();
  const tabs = { single: ui.tabSingle, recipe: ui.tabRecipe, barcode: ui.tabBarcode };
  const panels = { single: ui.panelSingle, recipe: ui.panelRecipe, barcode: ui.panelBarcode };
  Object.keys(tabs).forEach(m => {
    tabs[m].setAttribute('aria-selected', String(m === mode));
    panels[m].hidden = m !== mode;
  });
  /* Open Food Facts needs no key, so the USDA key box is hidden on the barcode tab */
  ui.keyBox.hidden = mode === 'barcode';
  drawLabel();
}

/* Redraws the list of search matches, marking the selected one */
function drawResults() {
  ui.results.replaceChildren(...state.results.map(food => {
    const item = el('li');
    const btn = el('button');
    btn.type = 'button';
    btn.append(el('span', null, food.description), el('span', 'meta', food.dataType));
    if (state.selected && state.selected.fdcId === food.fdcId) btn.setAttribute('aria-current', 'true');
    btn.addEventListener('click', () => {
      state.selected = food;
      applySelection();
      drawResults();
      drawLabel();
      loadPortionsForSelected();
    });
    item.append(btn);
    return item;
  }));
}

/* Saves or clears the key when the key form is submitted */
ui.keyForm.addEventListener('submit', event => {
  event.preventDefault();
  const key = ui.keyInput.value.trim();
  if (!key) { setStatus(ui.keyStatus, 'Paste a key first.', true); return; }
  state.apiKey = key;
  const ok = saveKey(key);
  ui.keyInput.value = '';
  setStatus(ui.keyStatus, ok ? 'Key saved in this browser.' : 'Key kept for this tab only; browser storage is blocked.', !ok);
  ui.keyBox.open = false;
});

/* Removes the saved key */
ui.keyClear.addEventListener('click', () => {
  state.apiKey = '';
  saveKey('');
  ui.keyInput.value = '';
  setStatus(ui.keyStatus, 'Key cleared.', false);
});

/* Runs a USDA search when the search form is submitted */
ui.searchForm.addEventListener('submit', async event => {
  event.preventDefault();
  const query = ui.queryInput.value.trim();
  if (!query) return;
  if (!state.apiKey) {
    ui.keyBox.open = true;
    setStatus(ui.searchStatus, 'Add your USDA API key first.', true);
    return;
  }
  setStatus(ui.searchStatus, 'Searching...', false);
  try {
    state.results = await searchFoods(query, state.apiKey);
  } catch (err) {
    setStatus(ui.searchStatus, describeError(err), true);
    return;
  }
  if (state.results.length === 0) {
    state.selected = null;
    drawResults();
    setStatus(ui.searchStatus, 'No matches. Try a simpler name.', false);
    return;
  }
  state.selected = state.results[0];
  applySelection();
  drawResults();
  drawLabel();
  setStatus(ui.searchStatus, 'Showing the best match. Pick another below if it is wrong.', false);
  loadPortionsForSelected();
});

/* Fills a unit dropdown with the given units and selects one */
function drawUnitOptions(select, units, selectedId) {
  select.replaceChildren(...units.map(u => {
    const option = el('option', null, u.label);
    option.value = u.id;
    return option;
  }));
  select.value = selectedId;
}

/* Connects an amount box and unit dropdown to a serving model ({ grams, unitId, amount }).
   Typing an amount recomputes grams; changing the unit keeps the same weight and shows it in
   the new unit. onChange redraws whatever depends on the serving. */
function wireServing(model, amountInput, unitSelect, getUnits, onChange) {
  amountInput.addEventListener('input', () => {
    const amount = Number(amountInput.value);
    const unit = getUnits().find(u => u.id === model.unitId);
    if (!unit || !(amount > 0)) return;
    const grams = amount * unit.gramsPer;
    if (!isValidServingGrams(grams)) return;
    model.amount = amount;
    model.grams = grams;
    onChange();
  });
  unitSelect.addEventListener('change', () => {
    const unit = getUnits().find(u => u.id === unitSelect.value);
    if (!unit) return;
    model.unitId = unit.id;
    model.amount = model.grams / unit.gramsPer;
    amountInput.value = trimAmount(model.amount);
    onChange();
  });
}

/* Applies a food's household measures to the single-food serving. A chosen measure that the new
   food also has keeps its amount (1 cup stays 1 cup); one it lacks falls back to grams. */
function setPortions(portions) {
  state.portions = portions;
  const unit = servingUnits(portions).find(u => u.id === state.unitId);
  const grams = unit ? unit.gramsPer * state.amount : 0;
  if (unit && unit.household && isValidServingGrams(grams)) {
    state.grams = grams;
  } else if (!unit || unit.household) {
    state.unitId = 'g';
    state.amount = state.grams;
    ui.amountInput.value = trimAmount(state.amount);
  }
  drawUnitOptions(ui.unitSelect, servingUnits(portions), state.unitId);
  applySelection();
  drawLabel();
}

/* Loads the selected food's household measures (cup, tbsp, slice...) in the background.
   If they cannot be loaded, only grams and ounces are offered. */
async function loadPortionsForSelected() {
  const food = state.selected;
  if (!food) return;
  let portions = [];
  try {
    portions = await fetchPortions(food.fdcId, state.apiKey);
  } catch (err) {
    portions = [];
  }
  if (state.selected === food) setPortions(portions);
}

wireServing(state, ui.amountInput, ui.unitSelect, () => servingUnits(state.portions), () => {
  applySelection();
  drawLabel();
});
drawUnitOptions(ui.unitSelect, servingUnits([]), state.unitId);

/* ---------- Recipe wiring (DOM) ---------- */

/* Removes one ingredient: drops its card and its line from the text box (so Calculate
   does not bring it back), then recomputes the label */
function removeLine(line) {
  recipe.lines = recipe.lines.filter(l => l !== line);
  const rows = ui.recipeInput.value.split('\n');
  const at = rows.findIndex(r => r.trim() === line.raw);
  if (at !== -1) {
    rows.splice(at, 1);
    ui.recipeInput.value = rows.join('\n');
  }
  refreshRecipe();
}

/* Builds the review card for one ingredient line: remove button, match picker, grams box, note or error */
function renderLineCard(line) {
  const item = el('li', 'card stack');

  const head = el('div', 'card-head');
  const remove = el('button', 'icon');
  remove.type = 'button';
  remove.setAttribute('aria-label', 'Remove ingredient: ' + line.raw);
  remove.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  remove.addEventListener('click', () => removeLine(line));
  head.append(el('span', 'raw', line.raw), remove);
  item.append(head);

  /* Lines that were understood always get a way to search again, even with zero matches */
  if (!line.parsed.error) {
    if (line.candidates.length) {
      const matchLabel = el('label', 'field', 'USDA match');
      const select = el('select');
      line.candidates.forEach((food, i) => {
        const option = el('option', null, food.description + ' (' + food.dataType + ')');
        option.value = String(i);
        select.append(option);
      });
      select.value = String(line.selected);
      select.addEventListener('change', () => {
        line.selected = Number(select.value);
        reresolveLine(line);
      });
      matchLabel.append(select);
      item.append(matchLabel);

      if (line.hasMore) {
        const more = el('button', 'tint', 'Show more matches');
        more.type = 'button';
        more.addEventListener('click', () => {
          more.disabled = true;
          runLineAction(() => moreForLine(line));
        });
        item.append(more);
      }
    }

    const searchForm = el('form', 'row-inline');
    const searchLabel = el('label', 'field', 'Search USDA again');
    searchLabel.style.flex = '1';
    const searchBox = el('input');
    searchBox.type = 'text';
    searchBox.value = line.query;
    searchBox.spellcheck = false;
    searchBox.placeholder = 'e.g. wheat flour';
    searchLabel.append(searchBox);
    const searchBtn = el('button', 'tint', 'Search');
    searchBtn.type = 'submit';
    searchForm.addEventListener('submit', event => {
      event.preventDefault();
      const query = searchBox.value.trim();
      if (!query) return;
      searchBtn.disabled = true;
      runLineAction(() => researchLine(line, query));
    });
    searchForm.append(searchLabel, searchBtn);
    item.append(searchForm);
    if (line.searchMsg) item.append(el('p', 'status', line.searchMsg));
  }

  if (line.candidates.length) {
    const gramsLabel = el('label', 'field', 'Grams');
    const gramsBox = el('input');
    gramsBox.type = 'number';
    gramsBox.min = '0';
    gramsBox.step = 'any';
    gramsBox.placeholder = 'enter grams';
    gramsBox.value = line.grams ? formatNumber(line.grams) : '';
    gramsBox.addEventListener('change', () => {
      const v = Number(gramsBox.value);
      line.gramsOverride = v > 0 ? v : null;
      reresolveLine(line);
    });
    gramsLabel.append(gramsBox);
    item.append(gramsLabel);
  }

  const message = line.error || line.note;
  if (message) item.append(el('p', 'status' + (line.error ? ' error' : ''), message));
  return item;
}

/* Redraws all ingredient review cards */
function drawLines() {
  ui.lines.replaceChildren(...recipe.lines.map(renderLineCard));
}

/* Recomputes the recipe label and redraws cards, label and the summary line */
function refreshRecipe() {
  recomputeRecipe();
  drawLines();
  drawLabel();
  const total = recipe.lines.length;
  const left = total - recipe.counted;
  if (total === 0) setStatus(ui.recipeStatus, '', false);
  else if (left > 0) {
    setStatus(ui.recipeStatus, left + ' of ' + total + ' ingredients need attention and are left out. The label is incomplete.', true);
  } else setStatus(ui.recipeStatus, 'All ' + total + ' ingredients counted. Check each match below.', false);
}

/* Re-resolves one line after the person changed its match or grams, then refreshes */
async function reresolveLine(line) {
  try {
    await resolveLine(line);
  } catch (err) {
    setStatus(ui.recipeStatus, describeError(err), true);
    return;
  }
  refreshRecipe();
}

/* Runs a card action that changes a line's matches (search again, show more), then refreshes.
   A fatal lookup error (bad key, rate limit, offline) is shown in the recipe status line. */
async function runLineAction(action) {
  try {
    await action();
  } catch (err) {
    setStatus(ui.recipeStatus, describeError(err), true);
    drawLines();
    return;
  }
  refreshRecipe();
}

/* Looks up every ingredient line when the recipe form is submitted */
ui.recipeForm.addEventListener('submit', async event => {
  event.preventDefault();
  const rawLines = ui.recipeInput.value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!rawLines.length) { setStatus(ui.recipeStatus, 'Enter at least one ingredient.', true); return; }
  if (rawLines.length > MAX_RECIPE_LINES) {
    setStatus(ui.recipeStatus, 'Limit is ' + MAX_RECIPE_LINES + ' ingredients per recipe.', true);
    return;
  }
  if (!state.apiKey) {
    ui.keyBox.open = true;
    setStatus(ui.recipeStatus, 'Add your USDA API key first.', true);
    return;
  }
  const servings = Number(ui.servingsInput.value);
  recipe.servings = servings >= 1 ? servings : 1;
  recipe.servingName = ui.servingNameInput.value.trim();
  ui.recipeBtn.disabled = true;
  recipe.lines = [];
  recomputeRecipe();
  drawLines();
  drawLabel();
  try {
    for (let i = 0; i < rawLines.length; i++) {
      setStatus(ui.recipeStatus, 'Looking up ' + (i + 1) + ' of ' + rawLines.length + '...', false);
      const line = makeLine(rawLines[i]);
      if (!line.parsed.error) {
        line.query = line.parsed.name;
        line.candidates = await searchFoods(line.query, state.apiKey, 1);
        line.hasMore = line.candidates.length >= SEARCH_PAGE_SIZE;
      }
      await resolveLine(line);
      recipe.lines.push(line);
    }
  } catch (err) {
    setStatus(ui.recipeStatus, describeError(err), true);
    return;
  } finally {
    ui.recipeBtn.disabled = false;
  }
  refreshRecipe();
});

/* Updates the label's serving name ("1 scone") as the person types it */
ui.servingNameInput.addEventListener('input', () => {
  recipe.servingName = ui.servingNameInput.value.trim();
  if (recipe.lines.length) {
    recomputeRecipe();
    drawLabel();
  }
});

/* Rescales the recipe label when the servings count changes */
ui.servingsInput.addEventListener('input', () => {
  const servings = Number(ui.servingsInput.value);
  if (!(servings >= 1 && servings <= 100)) return;
  recipe.servings = servings;
  if (recipe.lines.length) refreshRecipe();
});

/* ---------- Barcode wiring (DOM) ---------- */

/* Rebuilds the barcode label from the product and current grams */
function applyBarcode() {
  barcode.label = buildBarcodeLabel(barcode.product, barcode.grams);
  /* In ounces the label shows the ounce amount instead of the package's own serving text */
  if (barcode.unitId === 'oz') barcode.label.servingSize = servingSizeText(UNIT_OUNCES, barcode.amount);
  const who = (barcode.product.brand ? barcode.product.brand + ' ' : '') + barcode.product.name;
  barcode.sourceText = 'Source: Open Food Facts community data, which may be incomplete or wrong: ' + who;
}

/* Shows the product name, brand and package serving under the form, or hides the card */
function drawBarcodeInfo() {
  const product = barcode.product;
  ui.barcodeInfo.hidden = !product;
  if (!product) { ui.barcodeInfo.replaceChildren(); return; }
  const lines = [el('span', 'raw', product.name)];
  if (product.brand) lines.push(el('span', 'meta', product.brand));
  lines.push(el('span', 'meta', 'Barcode ' + product.code));
  lines.push(el('span', 'meta', product.servingText
    ? 'Serving on package: ' + product.servingText
    : 'No serving size on record; using the serving size entered above.'));
  ui.barcodeInfo.replaceChildren(...lines);
}

/* Looks up the typed barcode when the barcode form is submitted */
ui.barcodeForm.addEventListener('submit', async event => {
  event.preventDefault();
  const code = normalizeBarcode(ui.barcodeInput.value);
  if (!code) {
    setStatus(ui.barcodeStatus, 'Enter the 8 to 14 digit number printed under the barcode.', true);
    return;
  }
  setStatus(ui.barcodeStatus, 'Looking up...', false);
  ui.barcodeBtn.disabled = true;
  let product;
  try {
    product = await fetchProduct(code);
  } catch (err) {
    setStatus(ui.barcodeStatus, describeOffError(err), true);
    return;
  } finally {
    ui.barcodeBtn.disabled = false;
  }
  if (!product) {
    barcode.product = null;
    barcode.label = null;
    drawBarcodeInfo();
    drawLabel();
    setStatus(ui.barcodeStatus, 'No product with that barcode in Open Food Facts.', true);
    return;
  }
  barcode.product = product;
  barcode.grams = product.servingGrams || 100;
  barcode.unitId = 'g';
  barcode.amount = barcode.grams;
  drawUnitOptions(ui.barcodeUnit, servingUnits([]), barcode.unitId);
  ui.barcodeAmount.value = trimAmount(barcode.amount);
  applyBarcode();
  drawBarcodeInfo();
  drawLabel();
  setStatus(ui.barcodeStatus, 'Found. Check it against the package; community data can be wrong.', false);
});

/* Rescales the barcode label when the serving size or its unit changes (grams or ounces) */
wireServing(barcode, ui.barcodeAmount, ui.barcodeUnit, () => servingUnits([]), () => {
  if (!barcode.product) return;
  applyBarcode();
  drawLabel();
});
drawUnitOptions(ui.barcodeUnit, servingUnits([]), barcode.unitId);

ui.tabSingle.addEventListener('click', () => setMode('single'));
ui.tabRecipe.addEventListener('click', () => setMode('recipe'));
ui.tabBarcode.addEventListener('click', () => setMode('barcode'));

/* ---------- Barcode scanning (decoder logic, then DOM wiring) ---------- */

/* Scanner state: a session number (lets a late camera start notice it was cancelled),
   the camera stream, the frame timer, a reusable canvas and the lazily built decoder. */
const scan = { session: 0, stream: null, timer: null, busy: false, reader: null, hints: null,
               canvas: document.createElement('canvas') };

/* Frame decode interval while the live camera is on, in milliseconds */
const SCAN_INTERVAL_MS = 150;

/* Converts an 8-digit UPC-E code to the 12-digit UPC-A form that product databases store */
function upcEToUpcA(upce) {
  const body = upce.slice(1, 7);
  const last = body[5];
  let maker, item;
  if (last === '0' || last === '1' || last === '2') { maker = body.slice(0, 2) + last + '00'; item = '00' + body.slice(2, 5); }
  else if (last === '3') { maker = body.slice(0, 3) + '00'; item = '000' + body.slice(3, 5); }
  else if (last === '4') { maker = body.slice(0, 4) + '0'; item = '0000' + body[4]; }
  else { maker = body.slice(0, 5); item = '0000' + last; }
  return upce[0] + maker + item + upce[7];
}

/* Builds the UPC/EAN decoder once, limited to the barcode types printed on food packages */
function getScanReader() {
  if (!scan.reader) {
    scan.hints = new Map();
    scan.hints.set(ZX.DecodeHintType.POSSIBLE_FORMATS,
      [ZX.BarcodeFormat.EAN_13, ZX.BarcodeFormat.EAN_8, ZX.BarcodeFormat.UPC_A, ZX.BarcodeFormat.UPC_E]);
    scan.hints.set(ZX.DecodeHintType.TRY_HARDER, true);
    scan.reader = new ZX.MultiFormatUPCEANReader(scan.hints);
  }
  return scan.reader;
}

/* Decodes whatever is drawn on the scan canvas; returns the barcode digits, or null if none is found */
function decodeScanCanvas() {
  try {
    const source = new ZX.HTMLCanvasElementLuminanceSource(scan.canvas);
    const bitmap = new ZX.BinaryBitmap(new ZX.HybridBinarizer(source));
    const result = getScanReader().decode(bitmap, scan.hints);
    let text = result.getText();
    if (result.getBarcodeFormat() === ZX.BarcodeFormat.UPC_E) text = upcEToUpcA(text);
    return normalizeBarcode(text);
  } catch (err) {
    return null; /* the decoder throws "not found" for every frame without a barcode */
  }
}

/* Draws a photo on the scan canvas with its long side set to 1400px, then decodes it.
   Small photos are enlarged, which makes thin bars much easier for the decoder. */
function decodeScanImage(image, width, height) {
  const factor = 1400 / Math.max(width, height);
  scan.canvas.width = Math.round(width * factor);
  scan.canvas.height = Math.round(height * factor);
  const ctx = scan.canvas.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(image, 0, 0, scan.canvas.width, scan.canvas.height);
  return decodeScanCanvas();
}

/* Turns a camera error into a short message for the person */
function describeCameraError(err) {
  const name = err && err.name;
  if (name === 'NotAllowedError' || name === 'SecurityError') {
    return 'Camera access was blocked. Allow it in your browser settings, scan a photo, or type the number.';
  }
  if (name === 'NotFoundError' || name === 'OverconstrainedError') return 'No camera found. Scan a photo or type the number.';
  if (name === 'NotReadableError') return 'The camera is busy in another app. Close it and try again, or scan a photo.';
  return 'Could not start the camera. Scan a photo or type the number.';
}

/* Turns the live camera off and hides its card. Safe to call at any time. */
function stopScan() {
  scan.session++;
  if (scan.timer) clearInterval(scan.timer);
  scan.timer = null;
  if (scan.stream) scan.stream.getTracks().forEach(track => track.stop());
  scan.stream = null;
  ui.scanVideo.srcObject = null;
  ui.scanCard.hidden = true;
}

/* A barcode was read: stop scanning, put it in the box and look it up */
function onScanned(code) {
  stopScan();
  ui.barcodeInput.value = code;
  ui.barcodeForm.requestSubmit();
}

/* Reads one video frame and tries to decode it; skips the frame if the last one is still decoding */
function scanTick() {
  const video = ui.scanVideo;
  if (scan.busy || video.readyState < 2 || !video.videoWidth) return;
  scan.busy = true;
  scan.canvas.width = video.videoWidth;
  scan.canvas.height = video.videoHeight;
  scan.canvas.getContext('2d', { willReadFrequently: true }).drawImage(video, 0, 0);
  const code = decodeScanCanvas();
  scan.busy = false;
  if (code) onScanned(code);
}

/* Starts the live camera and checks a frame every SCAN_INTERVAL_MS until a barcode is read */
async function startScan() {
  stopScan();
  const session = scan.session;
  ui.scanCard.hidden = false;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus(ui.scanStatus, 'The camera is not available here (browsers need HTTPS for it). Scan a photo or type the number.', true);
    return;
  }
  setStatus(ui.scanStatus, 'Starting the camera...', false);
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
  } catch (err) {
    if (session === scan.session) setStatus(ui.scanStatus, describeCameraError(err), true);
    return;
  }
  if (session !== scan.session) { stream.getTracks().forEach(track => track.stop()); return; }
  scan.stream = stream;
  ui.scanVideo.srcObject = stream;
  try { await ui.scanVideo.play(); } catch (err) { /* autoplay can be refused; frames still arrive once visible */ }
  setStatus(ui.scanStatus, 'Point the camera at the barcode and hold steady.', false);
  scan.timer = setInterval(scanTick, SCAN_INTERVAL_MS);
}

/* Reads a barcode from a chosen or taken photo */
async function scanPhoto(file) {
  stopScan();
  setStatus(ui.barcodeStatus, 'Reading the photo...', false);
  let code = null;
  try {
    const bitmap = await createImageBitmap(file);
    code = decodeScanImage(bitmap, bitmap.width, bitmap.height);
    bitmap.close();
  } catch (err) {
    setStatus(ui.barcodeStatus, 'Could not open that image.', true);
    return;
  }
  if (!code) {
    setStatus(ui.barcodeStatus, 'No barcode found in that photo. Try a closer, sharper, well-lit shot with the whole barcode in view, or type the number.', true);
    return;
  }
  onScanned(code);
}

ui.scanBtn.addEventListener('click', startScan);
ui.scanStop.addEventListener('click', stopScan);
ui.scanPhotoBtn.addEventListener('click', () => ui.scanFile.click());
ui.scanFile.addEventListener('change', () => {
  const file = ui.scanFile.files[0];
  ui.scanFile.value = '';
  if (file) scanPhoto(file);
});
/* Never leave the camera running in the background */
document.addEventListener('visibilitychange', () => { if (document.hidden) stopScan(); });
window.addEventListener('pagehide', stopScan);

/* ---------- Start ---------- */

/* Open the key box when no key is saved, then draw the first label */
ui.keyBox.open = !state.apiKey;
drawLabel();
</script>
