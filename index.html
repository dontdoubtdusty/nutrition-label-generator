<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutrition Label Creator v0.04</title>
<style>
  /* Page theme tokens; follows the system light/dark setting */
  :root {
    --page-bg: #f3f1ec;
    --page-fg: #1a1a1a;
    --page-muted: #5b5b5b;
    --card-bg: #ffffff;
    --card-border: #cfcac0;
    --input-bg: #ffffff;
    --btn-bg: #f6f4ef;
    --accent: #1f5f3f;
    --accent-fg: #ffffff;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page-bg: #16171a;
      --page-fg: #ececec;
      --page-muted: #a3a3ad;
      --card-bg: #1f2024;
      --card-border: #3a3b42;
      --input-bg: #121316;
      --btn-bg: #2a2b31;
      --accent: #6fcf97;
      --accent-fg: #0b1f14;
      --error: #ff8a80;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--page-fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }

  /* Page header with app name and version */
  header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 16px;
    max-width: 960px;
    margin: 0 auto;
  }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 700; }
  header .version { color: var(--page-muted); font-size: 0.85rem; }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 8px 16px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .note { margin: 0; color: var(--page-muted); font-size: 0.85rem; text-align: center; }

  /* The label itself stays black on white in both themes, like the real thing */
  .label {
    width: 100%;
    max-width: 320px;
    background: #fff;
    color: #000;
    border: 1px solid #000;
    padding: 6px 8px 8px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 0.95rem;
    line-height: 1.25;
  }
  .label h2 {
    margin: 0 0 2px;
    font-size: 2.1rem;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.5px;
  }
  .label .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    padding: 2px 0;
    border-top: 1px solid #000;
  }
  .label .row.first { border-top: 0; }
  .label .row.indent { padding-left: 1.1em; }
  .label .row.indent2 { padding-left: 2.2em; }
  .label strong { font-weight: 800; }
  .label .bar-thick { height: 9px; background: #000; margin: 2px 0; }
  .label .bar-med { height: 5px; background: #000; margin: 2px 0; }
  .label .servings { padding: 2px 0 2px; }
  .label .serving-size { font-weight: 800; font-size: 1.05rem; padding-bottom: 3px; }
  .label .small-bold { font-size: 0.8rem; font-weight: 800; }
  .label .calories {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0;
  }
  .label .calories .name { font-size: 1.6rem; font-weight: 900; line-height: 1.1; }
  .label .calories .value { font-size: 2.4rem; font-weight: 900; line-height: 1; }
  .label .dv-head { text-align: right; padding: 2px 0; border-top: 1px solid #000; }
  .label .footnote {
    margin: 0;
    padding-top: 4px;
    border-top: 1px solid #000;
    font-size: 0.7rem;
    line-height: 1.3;
  }

  /* Page layout: controls panel beside the label on wide screens, stacked on phones */
  .layout {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    justify-content: center;
    align-items: flex-start;
  }
  .panel {
    flex: 1 1 300px;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .label-col {
    flex: 0 1 320px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .row-inline { display: flex; gap: 8px; align-items: flex-end; }

  /* Cards, form fields and buttons */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 12px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--page-muted); }
  input[type="text"], input[type="password"], input[type="number"], select, textarea {
    font: inherit;
    font-size: 1rem;
    width: 100%;
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--card-border);
    border-radius: 6px;
    background: var(--input-bg);
    color: var(--page-fg);
  }
  button {
    font: inherit;
    font-size: 1rem;
    padding: 8px 14px;
    border: 1px solid var(--card-border);
    border-radius: 6px;
    background: var(--btn-bg);
    color: var(--page-fg);
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  details summary { cursor: pointer; font-size: 0.9rem; }
  details[open] summary { margin-bottom: 10px; }

  /* Status line and search results */
  .status { margin: 0; font-size: 0.85rem; min-height: 1.2em; color: var(--page-muted); }
  .status.error { color: var(--error); }
  .results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .results button { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 2px; }
  .results .meta { font-size: 0.75rem; color: var(--page-muted); }
  .results button[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  /* Mode tabs, panel bodies and recipe review cards */
  [hidden] { display: none !important; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { flex: 1; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  .panel-body { display: flex; flex-direction: column; gap: 14px; }
  textarea { resize: vertical; min-height: 7em; line-height: 1.4; }
  .lines { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .lines .raw { font-weight: 600; overflow-wrap: anywhere; }
  .lines .status { min-height: 0; }
</style>
</head>
<body>
<header>
  <h1>Nutrition Label Creator</h1>
  <span class="version">v0.04</span>
</header>
<main>
  <div class="layout">
    <div class="panel">
      <details class="card" id="key-box">
        <summary>USDA API key</summary>
        <form id="key-form" class="stack">
          <label class="field">Key (saved in this browser only)
            <input id="key-input" type="password" autocomplete="off" spellcheck="false">
          </label>
          <div class="row-inline">
            <button type="submit" class="primary">Save key</button>
            <button type="button" id="key-clear">Clear</button>
          </div>
          <p class="status" id="key-status" aria-live="polite"></p>
        </form>
      </details>

      <div class="tabs" role="tablist" aria-label="Mode">
        <button type="button" role="tab" id="tab-single" aria-selected="true" aria-controls="panel-single">Single food</button>
        <button type="button" role="tab" id="tab-recipe" aria-selected="false" aria-controls="panel-recipe">Recipe</button>
      </div>

      <div class="panel-body" id="panel-single" role="tabpanel" aria-labelledby="tab-single">
        <form id="search-form" class="card stack">
          <label class="field">Food
            <input id="query-input" type="text" placeholder="cheddar cheese" autocomplete="off" required>
          </label>
          <div class="row-inline">
            <label class="field" style="flex:1">Serving size (grams)
              <input id="grams-input" type="number" min="1" max="2000" step="1" value="100">
            </label>
            <button type="submit" class="primary">Search</button>
          </div>
        </form>

        <p class="status" id="search-status" aria-live="polite"></p>
        <ul class="results" id="results"></ul>
      </div>

      <div class="panel-body" id="panel-recipe" role="tabpanel" aria-labelledby="tab-recipe" hidden>
        <form id="recipe-form" class="card stack">
          <label class="field">Ingredients, one per line
            <textarea id="recipe-input" spellcheck="false" placeholder="200 g cheddar cheese&#10;1 1/2 cups flour&#10;2 large eggs&#10;2 tbsp butter"></textarea>
          </label>
          <div class="row-inline">
            <label class="field" style="flex:1">Servings in the recipe
              <input id="servings-input" type="number" min="1" max="100" step="1" value="1">
            </label>
            <button type="submit" class="primary" id="recipe-btn">Calculate</button>
          </div>
        </form>

        <p class="status" id="recipe-status" aria-live="polite"></p>
        <ul class="lines" id="lines"></ul>
      </div>
    </div>

    <div class="label-col">
      <section id="label-mount" aria-label="Nutrition Facts label" style="width:100%;display:flex;justify-content:center;"></section>
      <p class="note" id="source-note"></p>
    </div>
  </div>
</main>

<script>
/* ---------- Reference data ---------- */

/* Daily Values for a 2,000 calorie diet (FDA 2016 set), keyed by nutrient */
const DAILY_VALUES = {
  totalFat: 78, satFat: 20, cholesterol: 300, sodium: 2300,
  totalCarbs: 275, fiber: 28, addedSugars: 50,
  vitaminD: 20, calcium: 1300, iron: 18, potassium: 4700
};

/* Layout of the label rows, top to bottom. Pure data, no DOM. */
const ROW_LAYOUT = [
  { key: 'totalFat',    label: 'Total Fat',          level: 0, bold: true,  dv: true },
  { key: 'satFat',      label: 'Saturated Fat',      level: 1, bold: false, dv: true },
  { key: 'transFat',    label: 'Trans Fat',          level: 1, bold: false, dv: false, italicName: true },
  { key: 'cholesterol', label: 'Cholesterol',        level: 0, bold: true,  dv: true },
  { key: 'sodium',      label: 'Sodium',             level: 0, bold: true,  dv: true },
  { key: 'totalCarbs',  label: 'Total Carbohydrate', level: 0, bold: true,  dv: true },
  { key: 'fiber',       label: 'Dietary Fiber',      level: 1, bold: false, dv: true },
  { key: 'totalSugars', label: 'Total Sugars',       level: 1, bold: false, dv: false },
  { key: 'addedSugars', label: 'Added Sugars',       level: 2, bold: false, dv: true, includes: true },
  { key: 'protein',     label: 'Protein',            level: 0, bold: true,  dv: false }
];

/* Rows shown under the third thick bar (vitamins and minerals) */
const MICRO_LAYOUT = [
  { key: 'vitaminD',  label: 'Vitamin D' },
  { key: 'calcium',   label: 'Calcium' },
  { key: 'iron',      label: 'Iron' },
  { key: 'potassium', label: 'Potassium' }
];

/* Sample label data. This is the shared data shape that lookups and recipe math
   produce: a flat nutrient map of { amount, unit } plus serving info. Amounts and
   calories are actual (unrounded) values; rounding happens only when drawing.
   An amount or calories of null means "no data". Any change to this shape must be
   flagged before it is made. */
const SAMPLE_LABEL = {
  servingsPerContainer: 8,
  servingSize: '2/3 cup',
  servingGrams: 55,
  calories: 230,
  nutrients: {
    totalFat:    { amount: 8,   unit: 'g'   },
    satFat:      { amount: 1,   unit: 'g'   },
    transFat:    { amount: 0,   unit: 'g'   },
    cholesterol: { amount: 0,   unit: 'mg'  },
    sodium:      { amount: 160, unit: 'mg'  },
    totalCarbs:  { amount: 37,  unit: 'g'   },
    fiber:       { amount: 4,   unit: 'g'   },
    totalSugars: { amount: 12,  unit: 'g'   },
    addedSugars: { amount: 10,  unit: 'g'   },
    protein:     { amount: 3,   unit: 'g'   },
    vitaminD:    { amount: 2,   unit: 'mcg' },
    calcium:     { amount: 260, unit: 'mg'  },
    iron:        { amount: 8,   unit: 'mg'  },
    potassium:   { amount: 235, unit: 'mg'  }
  }
};

/* ---------- Logic (no DOM) ---------- */

/* Formats a number for display: at most one decimal, no trailing ".0" */
function formatNumber(value) {
  return String(Math.round(value * 10) / 10);
}

/* Shown in place of an amount when USDA has no data for it */
const NO_DATA = '—';

/* Nutrients whose percent Daily Value is rounded in 2% / 5% / 10% steps */
const VITAMIN_MINERAL_KEYS = ['vitaminD', 'calcium', 'iron', 'potassium'];

/* Rounds a value to the nearest multiple of step */
function roundTo(value, step) {
  return Math.round(value / step) * step;
}

/* Rounds calories the FDA way: 0 under 5, nearest 5 up to 50, nearest 10 above */
function roundCalories(value) {
  if (value < 5) return 0;
  if (value <= 50) return roundTo(value, 5);
  return roundTo(value, 10);
}

/* Rounds one nutrient amount the FDA way and returns display text with its unit.
   Vitamin D, calcium, iron and potassium increments come from a secondary source. */
function roundNutrient(key, amount, unit) {
  let v;
  switch (key) {
    case 'totalFat': case 'satFat': case 'transFat':
      v = amount < 0.5 ? 0 : (amount < 5 ? roundTo(amount, 0.5) : roundTo(amount, 1));
      break;
    case 'cholesterol':
      if (amount < 2) { v = 0; break; }
      if (amount <= 5) return 'less than 5' + unit;
      v = roundTo(amount, 5);
      break;
    case 'sodium':
      v = amount < 5 ? 0 : (amount <= 140 ? roundTo(amount, 5) : roundTo(amount, 10));
      break;
    case 'totalCarbs': case 'fiber': case 'totalSugars': case 'addedSugars':
      if (amount < 0.5) { v = 0; break; }
      if (amount < 1) return 'less than 1' + unit;
      v = roundTo(amount, 1);
      break;
    case 'protein':
      v = amount < 0.5 ? 0 : roundTo(amount, 1);
      break;
    case 'vitaminD': v = roundTo(amount, 0.1); break;
    case 'calcium':  v = roundTo(amount, 10);  break;
    case 'iron':     v = roundTo(amount, 0.1); break;
    case 'potassium': v = roundTo(amount, 10); break;
    default: v = amount;
  }
  return formatNumber(v) + unit;
}

/* Returns the percent Daily Value from the unrounded amount, or null if there is no DV.
   Most nutrients round to a whole percent; vitamins and minerals use 2/5/10 steps. */
function percentDV(key, amount) {
  const dv = DAILY_VALUES[key];
  if (!dv) return null;
  const raw = (amount / dv) * 100;
  if (VITAMIN_MINERAL_KEYS.indexOf(key) === -1) return Math.round(raw);
  if (raw <= 10) return roundTo(raw, 2);
  if (raw <= 50) return roundTo(raw, 5);
  return roundTo(raw, 10);
}

/* Turns the label data into a flat list of display-ready rows (rounded, with dashes for no data) */
function buildRows(label) {
  const rows = ROW_LAYOUT.map(def => {
    const n = label.nutrients[def.key];
    const known = n.amount !== null;
    const amountText = known ? roundNutrient(def.key, n.amount, n.unit) : NO_DATA;
    const pct = known && def.dv ? percentDV(def.key, n.amount) : null;
    const includesText = def.includes && known;
    return {
      level: def.level,
      bold: def.bold,
      italicName: !!def.italicName,
      name: includesText ? 'Includes ' + amountText + ' Added Sugars' : def.label,
      amountText: includesText ? '' : amountText,
      percent: pct
    };
  });
  const micros = MICRO_LAYOUT.map(def => {
    const n = label.nutrients[def.key];
    const known = n.amount !== null;
    return {
      name: def.label,
      amountText: known ? roundNutrient(def.key, n.amount, n.unit) : NO_DATA,
      percent: known ? percentDV(def.key, n.amount) : null
    };
  });
  return { rows, micros };
}

/* ---------- Rendering (DOM only) ---------- */

/* Creates an element with optional class and text */
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

/* Builds one nutrient row: name and amount on the left, percent on the right */
function renderNutrientRow(row) {
  let cls = 'row';
  if (row.level === 1) cls += ' indent';
  if (row.level === 2) cls += ' indent2';
  const wrap = el('div', cls);

  const left = el('span');
  if (row.italicName) {
    left.append(el('em', null, 'Trans'), el('span', null, ' Fat'));
  } else {
    left.append(el(row.bold ? 'strong' : 'span', null, row.name));
  }
  if (row.amountText) left.append(el('span', null, ' ' + row.amountText));

  const right = el('strong', null, row.percent === null ? '' : row.percent + '%');
  wrap.append(left, right);
  return wrap;
}

/* Builds the whole label element from the label data */
function renderLabel(label) {
  const { rows, micros } = buildRows(label);
  const root = el('div', 'label');

  root.append(el('h2', null, 'Nutrition Facts'));
  /* servingsPerContainer is optional: a single food has no container count */
  if (label.servingsPerContainer) {
    root.append(el('div', 'servings', label.servingsPerContainer + (label.servingsPerContainer === 1
      ? ' serving per container' : ' servings per container')));
  }

  /* An empty servingSize means there is no household measure, so show grams only */
  const sizeText = label.servingSize
    ? label.servingSize + ' (' + label.servingGrams + 'g)'
    : label.servingGrams + 'g';
  const size = el('div', 'row first serving-size');
  size.append(el('span', null, 'Serving size'), el('span', null, sizeText));
  root.append(size);

  root.append(el('div', 'bar-thick'));
  root.append(el('div', 'small-bold', 'Amount per serving'));

  const cal = el('div', 'calories');
  const calText = label.calories === null ? NO_DATA : String(roundCalories(label.calories));
  cal.append(el('span', 'name', 'Calories'), el('span', 'value', calText));
  root.append(cal);

  root.append(el('div', 'bar-med'));
  root.append(el('div', 'small-bold dv-head', '% Daily Value*'));
  rows.forEach(row => root.append(renderNutrientRow(row)));

  root.append(el('div', 'bar-thick'));
  micros.forEach((row, i) => {
    const wrap = el('div', 'row' + (i === 0 ? ' first' : ''));
    wrap.append(el('span', null, row.name + ' ' + row.amountText),
                el('span', null, row.percent === null ? '' : row.percent + '%'));
    root.append(wrap);
  });

  root.append(el('div', 'bar-med'));
  root.append(el('p', 'footnote',
    '* The % Daily Value (DV) tells you how much a nutrient in a serving of food ' +
    'contributes to a daily diet. 2,000 calories a day is used for general nutrition advice.'));
  return root;
}

/* ---------- USDA lookup (no DOM) ---------- */

const USDA_SEARCH_URL = 'https://api.nal.usda.gov/fdc/v1/foods/search';
const KEY_STORAGE_NAME = 'nlc.usdaKey';

/* Units for each label nutrient, as USDA reports them */
const NUTRIENT_UNITS = {
  totalFat: 'g', satFat: 'g', transFat: 'g', cholesterol: 'mg', sodium: 'mg',
  totalCarbs: 'g', fiber: 'g', totalSugars: 'g', addedSugars: 'g', protein: 'g',
  vitaminD: 'mcg', calcium: 'mg', iron: 'mg', potassium: 'mg'
};

/* USDA nutrient numbers for each label field, in order of preference.
   Energy has fallbacks because Foundation foods often use the Atwater numbers. */
const NUTRIENT_SOURCES = {
  calories:    ['208', '957', '958'],
  totalFat:    ['204', '298'],
  satFat:      ['606'],
  transFat:    ['605'],
  cholesterol: ['601'],
  sodium:      ['307'],
  totalCarbs:  ['205'],
  fiber:       ['291'],
  totalSugars: ['269', '269.3'],
  addedSugars: ['539'],
  protein:     ['203'],
  vitaminD:    ['328'],
  calcium:     ['301'],
  iron:        ['303'],
  potassium:   ['306']
};

/* Reads the saved API key from localStorage; empty string if none or blocked */
function loadSavedKey() {
  try { return localStorage.getItem(KEY_STORAGE_NAME) || ''; } catch (e) { return ''; }
}

/* Saves (or clears, when empty) the API key; returns false if storage is blocked */
function saveKey(key) {
  try {
    if (key) localStorage.setItem(KEY_STORAGE_NAME, key);
    else localStorage.removeItem(KEY_STORAGE_NAME);
    return true;
  } catch (e) { return false; }
}

/* Pulls the label nutrients out of a USDA foodNutrients list (values are per 100 g).
   Nutrients USDA does not report are set to null (unknown, not zero). */
function extractPer100g(foodNutrients) {
  const byNumber = {};
  foodNutrients.forEach(n => { byNumber[String(n.nutrientNumber)] = n.value; });
  const result = {};
  Object.keys(NUTRIENT_SOURCES).forEach(key => {
    const found = NUTRIENT_SOURCES[key].find(num => typeof byNumber[num] === 'number');
    result[key] = found ? byNumber[found] : null;
  });
  return result;
}

/* Searches USDA generic foods and returns a simple list of matches */
async function searchFoods(query, apiKey) {
  const params = new URLSearchParams({
    api_key: apiKey,
    query: query,
    dataType: 'Foundation,SR Legacy',
    pageSize: '15'
  });
  const res = await fetch(USDA_SEARCH_URL + '?' + params.toString());
  if (!res.ok) {
    const err = new Error('HTTP ' + res.status);
    err.status = res.status;
    throw err;
  }
  const data = await res.json();
  return (data.foods || []).map(f => ({
    fdcId: f.fdcId,
    description: f.description,
    dataType: f.dataType,
    per100g: extractPer100g(f.foodNutrients || [])
  }));
}

/* Scales a food's per-100g nutrients to the chosen grams and returns label data */
function buildLabelFromFood(food, grams) {
  const factor = grams / 100;
  const nutrients = {};
  Object.keys(NUTRIENT_UNITS).forEach(key => {
    const per100 = food.per100g[key];
    nutrients[key] = { amount: per100 === null ? null : per100 * factor, unit: NUTRIENT_UNITS[key] };
  });
  return {
    servingsPerContainer: null,
    servingSize: '',
    servingGrams: grams,
    calories: food.per100g.calories === null ? null : food.per100g.calories * factor,
    nutrients: nutrients
  };
}

/* Turns a failed lookup into a short message for the person */
function describeError(err) {
  if (err.status === 400 || err.status === 403) return 'USDA rejected the API key. Check it in the key box.';
  if (err.status === 429) return 'USDA rate limit reached. Wait a bit and try again.';
  if (err.status) return 'USDA returned an error (' + err.status + ').';
  return 'Could not reach USDA. Check your connection.';
}

/* ---------- Recipe logic (no DOM) ---------- */

const USDA_FOOD_URL = 'https://api.nal.usda.gov/fdc/v1/food';
const MAX_RECIPE_LINES = 40;
const UNICODE_FRACTIONS = {
  '½': 0.5, '¼': 0.25, '¾': 0.75, '⅓': 1 / 3, '⅔': 2 / 3, '⅛': 0.125
};

/* Unit descriptions: weights know their grams, volumes know their millilitres */
function weightUnit(gramsPerUnit) { return { kind: 'weight', gramsPerUnit: gramsPerUnit }; }
function volumeUnit(canon, mlPerUnit) { return { kind: 'volume', canon: canon, mlPerUnit: mlPerUnit }; }

const FL_OZ = volumeUnit('floz', 29.5735);
const CUP = volumeUnit('cup', 236.588);
const TBSP = volumeUnit('tbsp', 14.7868);
const TSP = volumeUnit('tsp', 4.92892);
const MILLILITRE = volumeUnit('ml', 1);
const LITRE = volumeUnit('l', 1000);

/* Words a person might type for a unit. Null-prototype so words like "constructor" are not found. */
const UNIT_TABLE = Object.assign(Object.create(null), {
  g: weightUnit(1), gram: weightUnit(1), grams: weightUnit(1),
  kg: weightUnit(1000), kilogram: weightUnit(1000), kilograms: weightUnit(1000),
  oz: weightUnit(28.3495), ounce: weightUnit(28.3495), ounces: weightUnit(28.3495),
  lb: weightUnit(453.592), lbs: weightUnit(453.592), pound: weightUnit(453.592), pounds: weightUnit(453.592),
  cup: CUP, cups: CUP,
  tbsp: TBSP, tbs: TBSP, tablespoon: TBSP, tablespoons: TBSP,
  tsp: TSP, teaspoon: TSP, teaspoons: TSP,
  ml: MILLILITRE, milliliter: MILLILITRE, milliliters: MILLILITRE, millilitre: MILLILITRE, millilitres: MILLILITRE,
  l: LITRE, liter: LITRE, liters: LITRE, litre: LITRE, litres: LITRE
});

/* Counted units that USDA lists as portions ("slice", "clove"), mapped to one singular word */
const COUNT_UNIT_WORDS = Object.assign(Object.create(null), {
  slice: 'slice', slices: 'slice', clove: 'clove', cloves: 'clove',
  piece: 'piece', pieces: 'piece', stick: 'stick', sticks: 'stick', can: 'can', cans: 'can'
});

const SIZE_WORDS = ['small', 'medium', 'large'];

/* Reads a leading quantity such as "2", "0.5", "1/2", "1 1/2" or a fraction glyph; returns { value, rest } or null */
function parseAmount(text) {
  let m = text.match(/^(\d+)\s+(\d+)\/(\d+)\s*/);
  if (m && Number(m[3]) !== 0) {
    return { value: Number(m[1]) + Number(m[2]) / Number(m[3]), rest: text.slice(m[0].length) };
  }
  m = text.match(/^(\d+)?\s*([½¼¾⅓⅔⅛])\s*/);
  if (m) {
    return { value: (m[1] ? Number(m[1]) : 0) + UNICODE_FRACTIONS[m[2]], rest: text.slice(m[0].length) };
  }
  m = text.match(/^(\d+)\/(\d+)\s*/);
  if (m && Number(m[2]) !== 0) {
    return { value: Number(m[1]) / Number(m[2]), rest: text.slice(m[0].length) };
  }
  m = text.match(/^(\d*\.?\d+)\s*/);
  if (m) return { value: Number(m[1]), rest: text.slice(m[0].length) };
  return null;
}

/* Splits one ingredient line into amount, unit, size word and a search name.
   Returns { raw, error } when the line cannot be understood. */
function parseIngredientLine(raw) {
  const text = raw.trim().replace(/^[-*•]\s*/, '');
  const amt = parseAmount(text);
  if (!amt || !(amt.value > 0)) {
    return { raw: raw, error: 'No amount found. Start the line with a quantity, like "2 cups flour".' };
  }
  const words = amt.rest.trim().split(/\s+/).filter(Boolean);
  const clean = w => (w || '').toLowerCase().replace(/[.,]$/, '');
  const w0 = clean(words[0]);
  const w1 = clean(words[1]);
  let unit = null;
  let size = null;
  let consumed = 0;
  if (w0 === 'fl' && w1 === 'oz') { unit = FL_OZ; consumed = 2; }
  else if (w0 === 'fluid' && (w1 === 'ounce' || w1 === 'ounces')) { unit = FL_OZ; consumed = 2; }
  else if (UNIT_TABLE[w0]) { unit = UNIT_TABLE[w0]; consumed = 1; }
  else if (COUNT_UNIT_WORDS[w0]) { unit = { kind: 'count', canon: COUNT_UNIT_WORDS[w0] }; consumed = 1; }
  else if (SIZE_WORDS.indexOf(w0) !== -1) { size = w0; consumed = 1; }
  const name = words.slice(consumed).join(' ')
    .replace(/^of\s+/i, '')
    .replace(/\([^)]*\)/g, '')
    .split(',')[0]
    .trim();
  if (!name) return { raw: raw, error: 'No ingredient name found.' };
  return { raw: raw, amount: amt.value, unit: unit, size: size, name: name };
}

/* Returns the volume unit a portion description starts with ("cup, chopped" -> cup), or null */
function leadingVolumeUnit(text) {
  if (/^(fl\.? ?oz|fluid ounces?)\b/.test(text)) return FL_OZ;
  const first = text.split(/[\s,(]+/)[0];
  const u = UNIT_TABLE[first];
  return u && u.kind === 'volume' ? u : null;
}

/* True when a portion description starts with a weight unit ("oz", "g") */
function startsWithWeight(text) {
  const u = UNIT_TABLE[text.split(/[\s,(]+/)[0]];
  return !!(u && u.kind === 'weight');
}

/* Simplifies USDA foodPortions into { text, gramsPer } (grams for one unit).
   SR Legacy puts the whole measure in "modifier"; Foundation splits unit and qualifier. */
function normalizePortions(rawPortions) {
  const out = [];
  (rawPortions || []).forEach(p => {
    const amount = p.amount > 0 ? p.amount : 1;
    const unitName = p.measureUnit && p.measureUnit.name && p.measureUnit.name !== 'undetermined'
      ? p.measureUnit.name : '';
    const text = [unitName, p.modifier, p.portionDescription].filter(Boolean).join(' ').toLowerCase().trim();
    const gramsPer = p.gramWeight / amount;
    if (text && gramsPer > 0 && isFinite(gramsPer)) out.push({ text: text, gramsPer: gramsPer });
  });
  return out;
}

/* From a list of portions, prefers one whose description is just the unit word (plain "cup") */
function preferPlain(list) {
  return list.find(p => p.text.split(/[\s,(]+/).length === 1) || list[0];
}

/* Works out how many grams a parsed ingredient weighs, using the food's portions when needed.
   Returns { grams, note } or { error }. */
function resolveGrams(item, portions) {
  const unit = item.unit;
  if (unit && unit.kind === 'weight') {
    return { grams: item.amount * unit.gramsPerUnit, note: 'Converted from weight.' };
  }

  if (unit && unit.kind === 'volume') {
    const vols = portions.map(p => ({ p: p, u: leadingVolumeUnit(p.text) })).filter(x => x.u);
    if (!vols.length) return { error: 'No volume measure for this food. Enter grams.' };
    const same = vols.filter(x => x.u === unit);
    const plain = vols.filter(x => x.p.text.split(/[\s,(]+/).length === 1);
    let pick;
    if (same.length) pick = preferPlain(same.map(x => x.p));
    else if (plain.length) pick = plain[0].p;
    else pick = vols[0].p;
    const pickUnit = vols.find(x => x.p === pick).u;
    const gramsPerMl = pick.gramsPer / pickUnit.mlPerUnit;
    return {
      grams: item.amount * unit.mlPerUnit * gramsPerMl,
      note: 'Using "' + pick.text + '" = ' + formatNumber(pick.gramsPer) + ' g.'
    };
  }

  if (unit && unit.kind === 'count') {
    const re = new RegExp('\\b' + unit.canon + 's?\\b');
    const found = portions.filter(p => re.test(p.text));
    if (!found.length) return { error: 'No "' + unit.canon + '" measure for this food. Enter grams.' };
    const pick = found.find(p => p.text.indexOf(unit.canon) === 0) || found[0];
    return { grams: item.amount * pick.gramsPer, note: 'Using "' + pick.text + '" = ' + formatNumber(pick.gramsPer) + ' g.' };
  }

  /* No unit: a count of whole items, optionally with a size word (2 large eggs) */
  const items = portions.filter(p => !leadingVolumeUnit(p.text) && !startsWithWeight(p.text));
  if (!items.length) return { error: 'No unit measure for this food. Enter grams.' };
  let pick = null;
  const wanted = item.size ? [item.size] : ['medium', 'large'];
  wanted.forEach(word => {
    if (pick) return;
    pick = items.find(p => p.text.indexOf(word) === 0) ||
           items.find(p => new RegExp('\\b' + word + '\\b').test(p.text)) || null;
  });
  if (!pick) pick = items[0];
  return { grams: item.amount * pick.gramsPer, note: 'Using "' + pick.text + '" = ' + formatNumber(pick.gramsPer) + ' g each.' };
}

/* Adds up the counted ingredients and divides by servings; returns label data.
   A nutrient is null (no data) if any counted ingredient lacks it. */
function buildRecipeLabel(entries, servings) {
  const totalGrams = entries.reduce((sum, e) => sum + e.grams, 0);
  const sumOf = key => {
    let total = 0;
    for (const e of entries) {
      const v = e.food.per100g[key];
      if (v === null) return null;
      total += v * e.grams / 100;
    }
    return total / servings;
  };
  const nutrients = {};
  Object.keys(NUTRIENT_UNITS).forEach(key => {
    nutrients[key] = { amount: sumOf(key), unit: NUTRIENT_UNITS[key] };
  });
  return {
    servingsPerContainer: servings,
    servingSize: '1 serving',
    servingGrams: Math.round(totalGrams / servings),
    calories: sumOf('calories'),
    nutrients: nutrients
  };
}

/* Fetches (and remembers) a food's portions from the USDA detail endpoint */
const portionCache = new Map();
async function fetchPortions(fdcId, apiKey) {
  if (portionCache.has(fdcId)) return portionCache.get(fdcId);
  const res = await fetch(USDA_FOOD_URL + '/' + fdcId + '?' + new URLSearchParams({ api_key: apiKey }).toString());
  if (!res.ok) {
    const err = new Error('HTTP ' + res.status);
    err.status = res.status;
    throw err;
  }
  const data = await res.json();
  const portions = normalizePortions(data.foodPortions);
  portionCache.set(fdcId, portions);
  return portions;
}

/* True for errors that should stop the whole run (bad key, rate limit, no connection) */
function isFatalLookupError(err) {
  return !err.status || err.status === 400 || err.status === 403 || err.status === 429;
}

/* ---------- Page state ---------- */

const state = {
  mode: 'single',
  apiKey: loadSavedKey(),
  results: [],
  selected: null,
  grams: 100,
  label: SAMPLE_LABEL,
  sourceText: 'Sample data. Search for a food to replace it.'
};

/* Recipe-mode state: one entry per ingredient line, plus the computed label */
const recipe = { servings: 1, lines: [], nextId: 1, label: null, sourceText: '', counted: 0 };

/* Creates the state for one ingredient line (not yet looked up) */
function makeLine(raw) {
  return {
    id: recipe.nextId++, raw: raw, parsed: parseIngredientLine(raw),
    candidates: [], selected: 0, gramsOverride: null, grams: null, note: '', error: ''
  };
}

/* Works out one line's grams from the chosen USDA match (fetching portions if needed).
   Throws only for fatal errors; other problems are written onto the line. */
async function resolveLine(line) {
  line.grams = null;
  line.note = '';
  line.error = '';
  if (line.parsed.error) { line.error = line.parsed.error; return; }
  const food = line.candidates[line.selected];
  if (!food) { line.error = 'No USDA match. Try a simpler name.'; return; }
  if (line.gramsOverride) {
    line.grams = line.gramsOverride;
    line.note = 'Grams entered by you.';
    return;
  }
  const needsPortions = !(line.parsed.unit && line.parsed.unit.kind === 'weight');
  let portions = [];
  if (needsPortions) {
    try {
      portions = await fetchPortions(food.fdcId, state.apiKey);
    } catch (err) {
      if (isFatalLookupError(err)) throw err;
      line.error = 'Could not load measures for this food. Enter grams.';
      return;
    }
  }
  const result = resolveGrams(line.parsed, portions);
  if (result.error) line.error = result.error;
  else { line.grams = result.grams; line.note = result.note; }
}

/* Rebuilds the recipe label from the lines that have a match and grams */
function recomputeRecipe() {
  const entries = recipe.lines
    .filter(l => !l.error && l.grams > 0 && l.candidates[l.selected])
    .map(l => ({ food: l.candidates[l.selected], grams: l.grams }));
  recipe.counted = entries.length;
  if (!entries.length) { recipe.label = null; recipe.sourceText = ''; return; }
  recipe.label = buildRecipeLabel(entries, recipe.servings);
  recipe.sourceText = 'Recipe label per serving (' + recipe.servings + ' servings). ' +
    entries.length + ' of ' + recipe.lines.length + ' ingredients counted. Source: USDA FoodData Central.';
}

/* Rebuilds the label from the selected food and current grams */
function applySelection() {
  if (!state.selected) return;
  state.label = buildLabelFromFood(state.selected, state.grams);
  state.sourceText = 'Source: USDA FoodData Central (' + state.selected.dataType + '): ' + state.selected.description;
}

/* ---------- Page wiring (DOM) ---------- */

const ui = {
  keyBox: document.getElementById('key-box'),
  keyForm: document.getElementById('key-form'),
  keyInput: document.getElementById('key-input'),
  keyClear: document.getElementById('key-clear'),
  keyStatus: document.getElementById('key-status'),
  searchForm: document.getElementById('search-form'),
  queryInput: document.getElementById('query-input'),
  gramsInput: document.getElementById('grams-input'),
  searchStatus: document.getElementById('search-status'),
  results: document.getElementById('results'),
  labelMount: document.getElementById('label-mount'),
  sourceNote: document.getElementById('source-note'),
  tabSingle: document.getElementById('tab-single'),
  tabRecipe: document.getElementById('tab-recipe'),
  panelSingle: document.getElementById('panel-single'),
  panelRecipe: document.getElementById('panel-recipe'),
  recipeForm: document.getElementById('recipe-form'),
  recipeInput: document.getElementById('recipe-input'),
  servingsInput: document.getElementById('servings-input'),
  recipeBtn: document.getElementById('recipe-btn'),
  recipeStatus: document.getElementById('recipe-status'),
  lines: document.getElementById('lines')
};

/* Shows a message in a status line, styled as an error when asked */
function setStatus(node, text, isError) {
  node.textContent = text;
  node.className = 'status' + (isError ? ' error' : '');
}

/* Redraws the label and its source note for the active mode */
function drawLabel() {
  let label = state.label;
  let note = state.sourceText;
  if (state.mode === 'recipe') {
    label = recipe.label || SAMPLE_LABEL;
    note = recipe.label ? recipe.sourceText : 'Sample data. Add ingredients and press Calculate.';
  }
  ui.labelMount.replaceChildren(renderLabel(label));
  ui.sourceNote.textContent = note;
}

/* Switches between the single-food and recipe panels */
function setMode(mode) {
  state.mode = mode;
  const isRecipe = mode === 'recipe';
  ui.panelSingle.hidden = isRecipe;
  ui.panelRecipe.hidden = !isRecipe;
  ui.tabSingle.setAttribute('aria-selected', String(!isRecipe));
  ui.tabRecipe.setAttribute('aria-selected', String(isRecipe));
  drawLabel();
}

/* Redraws the list of search matches, marking the selected one */
function drawResults() {
  ui.results.replaceChildren(...state.results.map(food => {
    const item = el('li');
    const btn = el('button');
    btn.type = 'button';
    btn.append(el('span', null, food.description), el('span', 'meta', food.dataType));
    if (state.selected && state.selected.fdcId === food.fdcId) btn.setAttribute('aria-current', 'true');
    btn.addEventListener('click', () => {
      state.selected = food;
      applySelection();
      drawResults();
      drawLabel();
    });
    item.append(btn);
    return item;
  }));
}

/* Saves or clears the key when the key form is submitted */
ui.keyForm.addEventListener('submit', event => {
  event.preventDefault();
  const key = ui.keyInput.value.trim();
  if (!key) { setStatus(ui.keyStatus, 'Paste a key first.', true); return; }
  state.apiKey = key;
  const ok = saveKey(key);
  ui.keyInput.value = '';
  setStatus(ui.keyStatus, ok ? 'Key saved in this browser.' : 'Key kept for this tab only; browser storage is blocked.', !ok);
  ui.keyBox.open = false;
});

/* Removes the saved key */
ui.keyClear.addEventListener('click', () => {
  state.apiKey = '';
  saveKey('');
  ui.keyInput.value = '';
  setStatus(ui.keyStatus, 'Key cleared.', false);
});

/* Runs a USDA search when the search form is submitted */
ui.searchForm.addEventListener('submit', async event => {
  event.preventDefault();
  const query = ui.queryInput.value.trim();
  if (!query) return;
  if (!state.apiKey) {
    ui.keyBox.open = true;
    setStatus(ui.searchStatus, 'Add your USDA API key first.', true);
    return;
  }
  setStatus(ui.searchStatus, 'Searching...', false);
  try {
    state.results = await searchFoods(query, state.apiKey);
  } catch (err) {
    setStatus(ui.searchStatus, describeError(err), true);
    return;
  }
  if (state.results.length === 0) {
    state.selected = null;
    drawResults();
    setStatus(ui.searchStatus, 'No matches. Try a simpler name.', false);
    return;
  }
  state.selected = state.results[0];
  applySelection();
  drawResults();
  drawLabel();
  setStatus(ui.searchStatus, 'Showing the best match. Pick another below if it is wrong.', false);
});

/* Rescales the label when the serving size changes */
ui.gramsInput.addEventListener('input', () => {
  const grams = Number(ui.gramsInput.value);
  if (!(grams >= 1 && grams <= 2000)) return;
  state.grams = grams;
  applySelection();
  drawLabel();
});

/* ---------- Recipe wiring (DOM) ---------- */

/* Builds the review card for one ingredient line: match picker, grams box, note or error */
function renderLineCard(line) {
  const item = el('li', 'card stack');
  item.append(el('span', 'raw', line.raw));

  if (line.candidates.length) {
    const matchLabel = el('label', 'field', 'USDA match');
    const select = el('select');
    line.candidates.forEach((food, i) => {
      const option = el('option', null, food.description + ' (' + food.dataType + ')');
      option.value = String(i);
      select.append(option);
    });
    select.value = String(line.selected);
    select.addEventListener('change', () => {
      line.selected = Number(select.value);
      reresolveLine(line);
    });
    matchLabel.append(select);

    const gramsLabel = el('label', 'field', 'Grams');
    const gramsBox = el('input');
    gramsBox.type = 'number';
    gramsBox.min = '0';
    gramsBox.step = 'any';
    gramsBox.placeholder = 'enter grams';
    gramsBox.value = line.grams ? formatNumber(line.grams) : '';
    gramsBox.addEventListener('change', () => {
      const v = Number(gramsBox.value);
      line.gramsOverride = v > 0 ? v : null;
      reresolveLine(line);
    });
    gramsLabel.append(gramsBox);
    item.append(matchLabel, gramsLabel);
  }

  const message = line.error || line.note;
  if (message) item.append(el('p', 'status' + (line.error ? ' error' : ''), message));
  return item;
}

/* Redraws all ingredient review cards */
function drawLines() {
  ui.lines.replaceChildren(...recipe.lines.map(renderLineCard));
}

/* Recomputes the recipe label and redraws cards, label and the summary line */
function refreshRecipe() {
  recomputeRecipe();
  drawLines();
  drawLabel();
  const total = recipe.lines.length;
  const left = total - recipe.counted;
  if (total === 0) setStatus(ui.recipeStatus, '', false);
  else if (left > 0) {
    setStatus(ui.recipeStatus, left + ' of ' + total + ' ingredients need attention and are left out. The label is incomplete.', true);
  } else setStatus(ui.recipeStatus, 'All ' + total + ' ingredients counted. Check each match below.', false);
}

/* Re-resolves one line after the person changed its match or grams, then refreshes */
async function reresolveLine(line) {
  try {
    await resolveLine(line);
  } catch (err) {
    setStatus(ui.recipeStatus, describeError(err), true);
    return;
  }
  refreshRecipe();
}

/* Looks up every ingredient line when the recipe form is submitted */
ui.recipeForm.addEventListener('submit', async event => {
  event.preventDefault();
  const rawLines = ui.recipeInput.value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!rawLines.length) { setStatus(ui.recipeStatus, 'Enter at least one ingredient.', true); return; }
  if (rawLines.length > MAX_RECIPE_LINES) {
    setStatus(ui.recipeStatus, 'Limit is ' + MAX_RECIPE_LINES + ' ingredients per recipe.', true);
    return;
  }
  if (!state.apiKey) {
    ui.keyBox.open = true;
    setStatus(ui.recipeStatus, 'Add your USDA API key first.', true);
    return;
  }
  const servings = Number(ui.servingsInput.value);
  recipe.servings = servings >= 1 ? servings : 1;
  ui.recipeBtn.disabled = true;
  recipe.lines = [];
  recomputeRecipe();
  drawLines();
  drawLabel();
  try {
    for (let i = 0; i < rawLines.length; i++) {
      setStatus(ui.recipeStatus, 'Looking up ' + (i + 1) + ' of ' + rawLines.length + '...', false);
      const line = makeLine(rawLines[i]);
      if (!line.parsed.error) line.candidates = await searchFoods(line.parsed.name, state.apiKey);
      await resolveLine(line);
      recipe.lines.push(line);
    }
  } catch (err) {
    setStatus(ui.recipeStatus, describeError(err), true);
    return;
  } finally {
    ui.recipeBtn.disabled = false;
  }
  refreshRecipe();
});

/* Rescales the recipe label when the servings count changes */
ui.servingsInput.addEventListener('input', () => {
  const servings = Number(ui.servingsInput.value);
  if (!(servings >= 1 && servings <= 100)) return;
  recipe.servings = servings;
  if (recipe.lines.length) refreshRecipe();
});

ui.tabSingle.addEventListener('click', () => setMode('single'));
ui.tabRecipe.addEventListener('click', () => setMode('recipe'));

/* ---------- Start ---------- */

/* Open the key box when no key is saved, then draw the first label */
ui.keyBox.open = !state.apiKey;
drawLabel();
</script>
</body>
</html>
